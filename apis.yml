aid: forma
name: Forma
description: 'Forma is a flexible employee benefits platform, founded in 2017, that lets
  companies design, customize, and scale employee spending accounts from a single system.
  Employers select from a suite of Lifestyle Spending Accounts (LSA), Health Spending Accounts
  (HSA), Health Reimbursement Arrangements (HRA), and Flexible Spending Accounts (FSA), and
  employees access benefits through the Forma Store, the Forma Visa Card, or reimbursement
  claims. Forma connects to employer systems through 40+ HRIS and payroll integrations
  (Workday, ADP, UKG, Paylocity), SCIM provisioning, SAML2 SSO, and file feeds. Forma does
  not publish a public developer REST API; its technical surface is HRIS/SSO/SCIM integration
  and its trust posture (SOC 2 Type 2, HIPAA, GDPR). Backed by Emergence Capital, Ribbit
  Capital, and Uncork Capital.'
